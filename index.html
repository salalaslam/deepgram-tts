<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepgram TTS - Approach 1 (Proxied)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #2ecc71;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .logs {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 3px 0;
        }

        .log-entry.info {
            color: #4ec9b0;
        }

        .log-entry.error {
            color: #f48771;
        }

        .log-entry.success {
            color: #89d185;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Deepgram TTS Streaming</h1>
        <p class="subtitle">Approach 1: server proxy (browser &harr; FastAPI &harr; Deepgram)</p>

        <div class="status">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">Disconnected</span>
        </div>

        <div class="input-group">
            <label for="textInput">Enter text to convert to speech:</label>
            <textarea
                id="textInput"
                placeholder="Type something here..."
            >Hello! This audio travels from Deepgram to the Python server, which relays it to your browser over a second WebSocket.</textarea>
        </div>

        <div class="button-group">
            <button id="connectBtn" class="btn-primary" onclick="connect()">Connect</button>
            <button id="speakBtn" class="btn-primary" onclick="speak()" disabled>Speak</button>
            <button id="stopBtn" class="btn-danger" onclick="stop()" disabled>Stop</button>
        </div>

        <div class="input-group">
            <label>Activity Log:</label>
            <div class="logs" id="logs"></div>
        </div>
    </div>

    <script>
        // Plays linear16 PCM chunks back to back as they arrive.
        class PcmPlayer {
            constructor(sampleRate) {
                this.sampleRate = sampleRate;
                this.ctx = null;
                this.nextTime = 0;
                this.leftover = null;
            }

            // Call from a click handler (browser autoplay policy).
            async start() {
                if (!this.ctx) {
                    this.ctx = new AudioContext({ sampleRate: this.sampleRate });
                }
                if (this.ctx.state === 'suspended') {
                    await this.ctx.resume();
                }
                this.nextTime = this.ctx.currentTime;
                this.leftover = null;
            }

            push(arrayBuffer) {
                if (!this.ctx) return;
                let bytes = new Uint8Array(arrayBuffer);
                // A chunk can in principle end mid-sample; carry the odd byte over.
                if (this.leftover) {
                    const merged = new Uint8Array(this.leftover.length + bytes.length);
                    merged.set(this.leftover);
                    merged.set(bytes, this.leftover.length);
                    bytes = merged;
                    this.leftover = null;
                }
                if (bytes.length % 2) {
                    this.leftover = bytes.slice(-1);
                    bytes = bytes.subarray(0, bytes.length - 1);
                }
                const samples = bytes.length / 2;
                if (!samples) return;

                const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.length);
                const buffer = this.ctx.createBuffer(1, samples, this.sampleRate);
                const channel = buffer.getChannelData(0);
                for (let i = 0; i < samples; i++) {
                    channel[i] = view.getInt16(i * 2, true) / 32768;
                }

                const source = this.ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(this.ctx.destination);
                const at = Math.max(this.ctx.currentTime, this.nextTime);
                source.start(at);
                this.nextTime = at + buffer.duration;
            }

            stop() {
                if (this.ctx) {
                    this.ctx.close();
                    this.ctx = null;
                }
            }
        }

        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const speakBtn = document.getElementById('speakBtn');
        const stopBtn = document.getElementById('stopBtn');
        const textInput = document.getElementById('textInput');
        const logs = document.getElementById('logs');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        const elapsed = (since) => `${Math.round(performance.now() - since)} ms`;

        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey && !speakBtn.disabled) {
                e.preventDefault();
                speak();
            }
        });

        const SAMPLE_RATE = 24000;
        // Served by server_approach1.py at http://localhost:8000; also works when opened as a file.
        const WS_URL = location.protocol.startsWith('http')
            ? `ws://${location.host}/ws`
            : 'ws://localhost:8000/ws';

        const connectBtn = document.getElementById('connectBtn');
        const player = new PcmPlayer(SAMPLE_RATE);
        let ws = null;
        let tSend = 0;
        let chunks = 0;

        function updateStatus(state) {
            const ready = state === 'ready';
            statusIndicator.classList.toggle('connected', ready);
            statusText.textContent = { ready: 'Connected (proxy and Deepgram)', connecting: 'Connecting...', closed: 'Disconnected' }[state];
            connectBtn.textContent = state === 'closed' ? 'Connect' : 'Disconnect';
            connectBtn.className = state === 'closed' ? 'btn-primary' : 'btn-secondary';
            speakBtn.disabled = !ready;
            stopBtn.disabled = true;
        }

        function connect() {
            if (ws) {
                ws.close();
                return;
            }
            const t0 = performance.now();
            log(`Connecting to ${WS_URL}...`, 'info');
            updateStatus('connecting');
            ws = new WebSocket(WS_URL);
            ws.binaryType = 'arraybuffer';

            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    if (chunks++ === 0) log(`First audio ${elapsed(tSend)} after sending text`, 'success');
                    player.push(event.data);
                    return;
                }
                const msg = JSON.parse(event.data);
                if (msg.type === 'Ready') {
                    // The server opens its Deepgram connection before replying.
                    log(`Proxy and Deepgram connected in ${elapsed(t0)}`, 'success');
                    updateStatus('ready');
                } else if (msg.type === 'Flushed') {
                    log(`All audio received (${chunks} chunks) in ${elapsed(tSend)}`, 'success');
                    speakBtn.disabled = false;
                    stopBtn.disabled = true;
                } else if (msg.type === 'Error') {
                    log(`Server: ${msg.message}`, 'error');
                }
            };

            ws.onclose = () => {
                log('Disconnected', 'info');
                ws = null;
                player.stop();
                updateStatus('closed');
            };

            ws.onerror = () => log('WebSocket error (is server_approach1.py running?)', 'error');
        }

        async function speak() {
            const text = textInput.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            await player.start();
            chunks = 0;
            tSend = performance.now();
            ws.send(text);
            log(`Sent ${text.length} characters`, 'info');
            speakBtn.disabled = true;
            stopBtn.disabled = false;
        }

        function stop() {
            // Stops local playback. Audio already requested still arrives and is dropped.
            player.stop();
            log('Playback stopped', 'info');
            stopBtn.disabled = true;
        }

        log('Click Connect, then Speak. Audio plays as chunks arrive.', 'info');
    </script>
</body>
</html>
